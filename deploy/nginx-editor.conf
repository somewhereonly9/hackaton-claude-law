# Sitio de Nginx. Se instala en /etc/nginx/sites-available/editor.
# Atiende editorwork.dagdugrangel.com.mx. El bloque HTTPS (puerto 443, certificado y
# redirección desde http) lo agrega certbot --nginx sobre la copia instalada en el servidor.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name editorwork.dagdugrangel.com.mx;

    # El contenido de un documento puede pesar hasta 2 MB.
    client_max_body_size 3m;

    location /estaticos/ {
        alias /srv/editor/app/app/web/estaticos/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La conversión a PDF puede tardar hasta 60 s.
        proxy_read_timeout 90s;
    }
}
