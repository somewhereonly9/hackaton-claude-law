# Sitio de Nginx. Se instala en /etc/nginx/sites-available/editor.
# Atiende editorwork.dagdugrangel.com.mx por HTTPS. Las líneas "managed by Certbot" las
# escribió certbot --nginx; los certificados viven en /etc/letsencrypt y se renuevan solos.
# Por http, y por cualquier otro nombre (como la IP), redirige al dominio con HTTPS.
server {
    server_name editorwork.dagdugrangel.com.mx;

    # El contenido de un documento puede pesar hasta 2 MB.
    client_max_body_size 3m;

    location /estaticos/ {
        alias /srv/editor/app/app/web/estaticos/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La conversión a PDF puede tardar hasta 60 s.
        proxy_read_timeout 90s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/editorwork.dagdugrangel.com.mx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/editorwork.dagdugrangel.com.mx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = editorwork.dagdugrangel.com.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name editorwork.dagdugrangel.com.mx;
    # Cualquier otro nombre (p. ej. la IP) se manda al dominio.
    return 301 https://editorwork.dagdugrangel.com.mx$request_uri;


}