[project]
name = "editor-documentos-legales"
version = "0.1.0"
description = "Editor de documentos legales con FastAPI, Jinja2 y HTMX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "sqlalchemy>=2",
    "pymysql",
    "alembic",
    "pydantic-settings",
    "argon2-cffi",
    "itsdangerous",
    "python-multipart",
    "cryptography",
    "python-docx",
    "openai",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
